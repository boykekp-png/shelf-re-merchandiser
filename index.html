<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shelf Re‑merchandiser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shelf Re‑merchandiser</h1>
    <div class="toolbar">
      <button id="cutBtn" title="Cut selected item (Ctrl+X)">✂️ Cut</button>
      <button id="pasteBtn" title="Paste item (Ctrl+V)" disabled>📋 Paste</button>
      <button id="addShelfBtn">+ Add Shelf</button>
    </div>
  </header>

  <main id="shelfContainer">
    <!-- Shelves will be generated by JavaScript -->
  </main>

  <script src="script.js"></script>
</body>
</html>
